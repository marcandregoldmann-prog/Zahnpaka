<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zahnpaka TTS Test</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .status {
            background: #f0f4f8;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .status.success {
            border-left-color: #4caf50;
        }
        .status.error {
            border-left-color: #f44336;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 10px 5px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .test-section {
            margin: 25px 0;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
        }
        .test-section h3 {
            margin-top: 0;
            color: #667eea;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .log {
            background: #1e1e1e;
            color: #00ff00;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 11px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 15px;
        }
        .log-entry {
            margin: 3px 0;
        }
        .log-entry.error { color: #ff6b6b; }
        .log-entry.success { color: #51cf66; }
        .log-entry.warning { color: #ffd43b; }
        .log-entry.info { color: #74c0fc; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🦷 Zahnpaka TTS Test</h1>

        <div class="test-section">
            <h3>1️⃣ Systemstatus</h3>
            <button onclick="checkStatus()">Status überprüfen</button>
            <div id="status-output" class="status"></div>
        </div>

        <div class="test-section">
            <h3>2️⃣ ResponsiveVoice laden</h3>
            <button onclick="testRVLoad()">RV CDN testen</button>
            <div id="rv-output" class="status"></div>
        </div>

        <div class="test-section">
            <h3>3️⃣ Stimmen verfügbar</h3>
            <button onclick="listVoices()">Verfügbare Stimmen auflisten</button>
            <div id="voices-output" class="status"></div>
        </div>

        <div class="test-section">
            <h3>4️⃣ Deutsche Sprachausgabe testen</h3>
            <input type="text" id="custom-text" placeholder="Text eingeben..." value="Hallo! Das ist Alpi, dein Zahnputz-Freund!">
            <button onclick="speakGerman()">Auf Deutsch sprechen</button>
            <button onclick="cancel()">Sprechen abbrechen</button>
            <div id="speak-output" class="status"></div>
        </div>

        <div class="test-section">
            <h3>5️⃣ Simulated Zahnpaka Flows</h3>
            <button onclick="simulateIntro()">Intro testen</button>
            <button onclick="simulateEncouragement()">Ermutigung testen</button>
            <button onclick="simulateFinish()">Abschluss testen</button>
            <div id="flow-output" class="status"></div>
        </div>

        <h3>📋 Konsolen-Ausgabe:</h3>
        <div id="log" class="log"></div>
    </div>

    <script src="https://code.responsivevoice.org/responsivevoice.js" async defer></script>
    <script>
        // Simple console logging to page
        const logDiv = document.getElementById('log');
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;

        function addLog(msg, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        console.log = function(...args) {
            addLog(args.join(' '), 'info');
            originalLog.apply(console, args);
        };
        console.error = function(...args) {
            addLog('ERROR: ' + args.join(' '), 'error');
            originalError.apply(console, args);
        };
        console.warn = function(...args) {
            addLog('WARN: ' + args.join(' '), 'warning');
            originalWarn.apply(console, args);
        };

        // Test functions
        function output(elementId, text, type = '') {
            const el = document.getElementById(elementId);
            el.textContent = text;
            el.className = 'status ' + type;
        }

        function checkStatus() {
            const result = {
                'ResponsiveVoice geladen': typeof responsiveVoice !== 'undefined',
                'CDN Fehler': window.RV_LOAD_STATE?.error || 'Keine',
                'Responsive Voice ist bereit': responsiveVoice?.isReady?.() || false,
                'Browser': navigator.userAgent.split(' ').slice(-2).join(' ')
            };

            const text = Object.entries(result)
                .map(([k, v]) => `${k}: ${v}`)
                .join('\n');

            const type = typeof responsiveVoice !== 'undefined' ? 'success' : 'error';
            output('status-output', text, type);
            console.log('Status:', result);
        }

        function testRVLoad() {
            output('rv-output', 'Teste ResponsiveVoice CDN...');

            if (typeof responsiveVoice !== 'undefined') {
                output('rv-output', '✅ ResponsiveVoice ist verfügbar!\n\nCDN erfolgreich geladen.', 'success');
                console.log('✅ RV loaded');
            } else {
                const msg = '⏳ Lädt noch... (max 8 Sekunden)\n\nWarte...';
                output('rv-output', msg);
                console.log('⏳ Waiting for RV...');

                // Warte bis zu 8 Sekunden
                let waited = 0;
                const timer = setInterval(() => {
                    waited += 100;
                    if (typeof responsiveVoice !== 'undefined') {
                        clearInterval(timer);
                        output('rv-output', '✅ ResponsiveVoice geladen nach ' + waited + 'ms', 'success');
                        console.log('✅ RV loaded after ' + waited + 'ms');
                    } else if (waited >= 8000) {
                        clearInterval(timer);
                        output('rv-output', '❌ ResponsiveVoice konnte nicht geladen werden\n\nInternet-Verbindung prüfen', 'error');
                        console.error('❌ RV failed to load');
                    }
                }, 100);
            }
        }

        function listVoices() {
            if (typeof responsiveVoice === 'undefined') {
                output('voices-output', 'ResponsiveVoice nicht geladen!', 'error');
                return;
            }

            try {
                const voices = responsiveVoice.getVoices?.() || [];
                if (voices.length === 0) {
                    output('voices-output', 'Keine Stimmen verfügbar', 'error');
                    return;
                }

                const germanVoices = voices.filter(v => v.name.includes('German'));
                const text = '🗣️ Insgesamt: ' + voices.length + ' Stimmen\n\n' +
                    '🇩🇪 Deutsche Stimmen:\n' +
                    (germanVoices.length > 0 ?
                        germanVoices.map(v => '  • ' + v.name).join('\n') :
                        '  Keine gefunden') +
                    '\n\n📊 Alle Stimmen:\n' +
                    voices.map(v => '  • ' + v.name).join('\n');

                output('voices-output', text, germanVoices.length > 0 ? 'success' : 'warning');
                console.log('Available voices:', voices);
            } catch (e) {
                output('voices-output', 'Fehler: ' + e.message, 'error');
                console.error('Voice list error:', e);
            }
        }

        function speakGerman() {
            if (typeof responsiveVoice === 'undefined') {
                output('speak-output', 'ResponsiveVoice nicht geladen!', 'error');
                return;
            }

            const text = document.getElementById('custom-text').value;
            if (!text.trim()) {
                output('speak-output', 'Bitte Text eingeben!', 'error');
                return;
            }

            try {
                output('speak-output', '🔊 Spreche: "' + text + '"\n\nLautstärke prüfen...');
                console.log('Speaking:', text);

                responsiveVoice.speak(text, 'German Female', {
                    rate: 0.9,
                    pitch: 1.0,
                    onstart: () => {
                        output('speak-output', '▶️ Sprachausgabe läuft...', 'success');
                        console.log('Speech started');
                    },
                    onend: () => {
                        output('speak-output', '✅ Sprachausgabe beendet!', 'success');
                        console.log('Speech ended');
                    },
                    onerror: (err) => {
                        output('speak-output', '❌ Fehler: ' + err, 'error');
                        console.error('Speech error:', err);
                    }
                });
            } catch (e) {
                output('speak-output', '❌ Exception: ' + e.message, 'error');
                console.error('Exception:', e);
            }
        }

        function cancel() {
            if (typeof responsiveVoice === 'undefined') return;
            responsiveVoice.cancel();
            output('speak-output', '⏹️ Abgebrochen', 'warning');
            console.log('Speech cancelled');
        }

        function simulateIntro() {
            const steps = [
                'Hallo! Ich bin Alpi, dein Zahnputz-Freund!',
                'Wir putzen drei Minuten lang deine Zähne.',
                'Los geht\'s! Schnapp dir deine Bürste!'
            ];

            output('flow-output', '🎬 Simuliere Intro...');
            let step = 0;

            const playStep = () => {
                if (step < steps.length) {
                    console.log(`Intro Step ${step + 1}:`, steps[step]);
                    output('flow-output', `Schritt ${step + 1}/${steps.length}:\n"${steps[step]}"`);

                    if (typeof responsiveVoice !== 'undefined') {
                        responsiveVoice.speak(steps[step], 'German Female', {
                            rate: 0.9,
                            onend: () => {
                                step++;
                                setTimeout(playStep, 500);
                            }
                        });
                    } else {
                        step++;
                        setTimeout(playStep, 1000);
                    }
                } else {
                    output('flow-output', '✅ Intro abgeschlossen!', 'success');
                }
            };
            playStep();
        }

        function simulateEncouragement() {
            const phrases = [
                'Das machst du toll!',
                'Wow, wie das funkelt!',
                'Du bist ein echter Profi!'
            ];
            const phrase = phrases[Math.floor(Math.random() * phrases.length)];

            output('flow-output', '💪 Ermutigung:\n"' + phrase + '"');
            console.log('Encouragement:', phrase);

            if (typeof responsiveVoice !== 'undefined') {
                responsiveVoice.speak(phrase, 'German Female', {
                    onstart: () => output('flow-output', '▶️ ' + phrase, 'success'),
                    onend: () => output('flow-output', '✅ Ermutigung abgeschlossen!', 'success')
                });
            }
        }

        function simulateFinish() {
            const name = prompt('Name eingeben:', 'Kind');
            if (!name) return;

            const msg = `Super gemacht, ${name}! Deine Zähne funkeln wie Sterne!`;
            output('flow-output', '🎉 Abschluss:\n"' + msg + '"');
            console.log('Finish:', msg);

            if (typeof responsiveVoice !== 'undefined') {
                responsiveVoice.speak(msg, 'German Female', {
                    rate: 0.9,
                    onstart: () => output('flow-output', '🎊 ' + msg, 'success'),
                    onend: () => output('flow-output', '✅ Glückwunsch abgeschlossen!', 'success')
                });
            }
        }

        // Initial status
        console.log('Zahnpaka TTS Test geladen');
        console.log('Browser:', navigator.userAgent);

        // Check RV load
        window.addEventListener('responsivevoiceready', () => {
            console.log('✅ ResponsiveVoice CDN Event gefeuert');
        });

        // Wait a bit for RV to load, then check status
        setTimeout(() => {
            checkStatus();
        }, 100);
    </script>
</body>
</html>
