<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zahnpaka – Dein Zahnputz-Freund</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F0F4F8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <!-- ResponsiveVoice TTS Library (async, non-blocking) -->
    <script src="https://code.responsivevoice.org/responsivevoice.js" async defer></script>
</head>
<body>

<div id="app-container">

    <!-- Mute-Button (immer sichtbar) -->
    <button id="btn-mute" class="btn-mute" aria-label="Ton an/aus">🔊</button>

    <!-- ==================== START-SCREEN ==================== -->
    <section id="screen-start" class="screen active" role="main">
        <div class="alpaka-container">
            <!-- Großes Alpi SVG mit animierten Features -->
            <svg id="alpaka-start" viewBox="0 0 200 220" class="alpaka-svg" aria-label="Alpaka Alpi, dein Zahnputz-Freund" role="img">
                <!-- Wollschopf -->
                <ellipse cx="100" cy="28" rx="32" ry="18" fill="#FFF5E1"/>
                <circle cx="78"  cy="26" r="10" fill="#FFF5E1"/>
                <circle cx="122" cy="26" r="10" fill="#FFF5E1"/>
                <circle cx="100" cy="20" r="12" fill="#FFF5E1"/>
                <!-- Ohren -->
                <rect x="68"  y="22" width="14" height="28" rx="7" fill="#FFE4B5" transform="rotate(-18 68 22)"/>
                <rect x="118" y="22" width="14" height="28" rx="7" fill="#FFE4B5" transform="rotate(18 118 22)"/>
                <rect x="71"  y="24" width="7" height="18" rx="4" fill="#FFB6C1" transform="rotate(-18 71 24)"/>
                <rect x="122" y="24" width="7" height="18" rx="4" fill="#FFB6C1" transform="rotate(18 122 24)"/>
                <!-- Kopf -->
                <ellipse cx="100" cy="78" rx="46" ry="44" fill="#FFF5E1"/>
                <!-- Augen -->
                <ellipse id="eye-l" cx="82" cy="68" rx="8" ry="9" fill="#fff" stroke="#333" stroke-width="1.5"/>
                <circle  id="pupil-l" cx="84" cy="70" r="4.5" fill="#333"/>
                <circle  cx="86" cy="68" r="1.5" fill="#fff"/>
                <ellipse id="eye-r" cx="118" cy="68" rx="8" ry="9" fill="#fff" stroke="#333" stroke-width="1.5"/>
                <circle  id="pupil-r" cx="120" cy="70" r="4.5" fill="#333"/>
                <circle  cx="122" cy="68" r="1.5" fill="#fff"/>
                <!-- Nase -->
                <ellipse cx="100" cy="88" rx="14" ry="9" fill="#FFD4C2"/>
                <circle cx="96" cy="88" r="3" fill="#E88E6A" opacity="0.6"/>
                <circle cx="104" cy="88" r="3" fill="#E88E6A" opacity="0.6"/>
                <!-- Mund (animierbar) -->
                <path id="alpaka-mouth" d="M 90 98 Q 100 108 110 98" fill="none" stroke="#E88E6A" stroke-width="3" stroke-linecap="round"/>
                <!-- Wangen-Rötung -->
                <ellipse cx="72" cy="82" rx="10" ry="6" fill="#FFB6C1" opacity="0.35"/>
                <ellipse cx="128" cy="82" rx="10" ry="6" fill="#FFB6C1" opacity="0.35"/>
                <!-- Körper -->
                <ellipse cx="100" cy="165" rx="58" ry="52" fill="#FFF5E1"/>
                <!-- Beine -->
                <rect x="68"  y="195" width="18" height="22" rx="9" fill="#FFE4B5"/>
                <rect x="114" y="195" width="18" height="22" rx="9" fill="#FFE4B5"/>
                <!-- Hufe -->
                <rect x="68"  y="212" width="18" height="8" rx="4" fill="#D4A86A"/>
                <rect x="114" y="212" width="18" height="8" rx="4" fill="#D4A86A"/>
            </svg>
        </div>

        <h1>Hallo! Ich bin Alpi! 🦙</h1>
        <p class="subtitle">Dein Zahnputz-Freund!</p>

        <label for="child-name" class="name-label">Wie heißt du? ✏️</label>
        <input type="text" id="child-name" placeholder="Dein Name" maxlength="12" autocomplete="off" autocorrect="off" spellcheck="false">

        <button id="btn-start" class="btn-main" aria-label="Zahnputzen starten">
            🦷 Zähne putzen!
        </button>
    </section>

    <!-- ==================== ZAHNTEUFEL-INTRO ==================== -->
    <section id="screen-intro" class="screen" role="main">
        <div class="intro-content">
            <div class="zahnteufel-scene">
                <!-- Alpi zeigt auf Zahnteufel -->
                <svg viewBox="0 0 280 140" class="intro-svg" aria-label="Alpi erklärt die Zahnteufel" role="img">
                    <!-- Mini Alpi links -->
                    <ellipse cx="55"  cy="90"  rx="38" ry="32" fill="#FFF5E1"/>
                    <ellipse cx="55"  cy="62"  rx="28" ry="26" fill="#FFF5E1"/>
                    <circle  cx="44"  cy="57"  r="5"  fill="#333"/>
                    <circle  cx="66"  cy="57"  r="5"  fill="#333"/>
                    <path d="M 47 72 Q 55 80 63 72" fill="none" stroke="#E88E6A" stroke-width="2.5" stroke-linecap="round"/>
                    <rect x="42" y="36" width="10" height="20" rx="5" fill="#FFE4B5" transform="rotate(-15 42 36)"/>
                    <rect x="62" y="36" width="10" height="20" rx="5" fill="#FFE4B5" transform="rotate(15 62 36)"/>
                    <!-- Alpi zeigt auf Teufel -->
                    <line x1="90" y1="75" x2="140" y2="75" stroke="#A3D8F4" stroke-width="3" stroke-dasharray="6,4" stroke-linecap="round"/>
                    <polygon points="138,70 150,75 138,80" fill="#A3D8F4"/>
                    <!-- Zahnteufel (süß, nicht gruselig) -->
                    <ellipse cx="200" cy="80" rx="30" ry="32" fill="#DDA0DD" opacity="0.9"/>
                    <ellipse cx="200" cy="62" rx="22" ry="20" fill="#DDA0DD"/>
                    <!-- Teufelshörner -->
                    <polygon points="185,46 178,28 195,42" fill="#CC77CC"/>
                    <polygon points="215,46 222,28 205,42" fill="#CC77CC"/>
                    <!-- Teufel-Augen -->
                    <ellipse cx="193" cy="60" rx="5" ry="5.5" fill="#fff"/>
                    <circle  cx="194" cy="61" r="3" fill="#333"/>
                    <ellipse cx="207" cy="60" rx="5" ry="5.5" fill="#fff"/>
                    <circle  cx="208" cy="61" r="3" fill="#333"/>
                    <!-- Teufel-Mund (böses Grinsen, aber niedlich) -->
                    <path d="M 192 70 Q 200 78 208 70" fill="none" stroke="#994499" stroke-width="2" stroke-linecap="round"/>
                    <!-- Kleine Zähne des Teufels -->
                    <rect x="195" y="70" width="5" height="6" rx="2" fill="#fff"/>
                    <!-- Teufel-Schwanz -->
                    <path d="M 225 95 Q 250 110 240 90 Q 260 80 245 70" fill="none" stroke="#CC77CC" stroke-width="3" stroke-linecap="round"/>
                    <polygon points="248,68 254,76 242,76" fill="#CC77CC"/>
                    <!-- Verbotssymbol über Teufel -->
                    <circle cx="200" cy="80" r="38" fill="none" stroke="#FF6B6B" stroke-width="4" opacity="0.7"/>
                    <line x1="173" y1="53" x2="227" y2="107" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
                </svg>
            </div>

            <div id="intro-speech" class="bubble intro-bubble">
                <span id="intro-text">Die Zahnteufel wollen auf deinen Zähnen feiern! 😱</span>
            </div>

            <div class="intro-progress">
                <div class="intro-dot active"></div>
                <div class="intro-dot"></div>
                <div class="intro-dot"></div>
            </div>

            <button id="btn-intro-next" class="btn-main">Weiter ➜</button>
            <button id="btn-intro-skip" class="btn-skip">Überspringen</button>
        </div>
    </section>

    <!-- ==================== TIMER/PUTZ-SCREEN ==================== -->
    <section id="screen-timer" class="screen" role="main">

        <!-- Kopfzeile mit Fortschritt -->
        <div class="status-bar">
            <div id="progress-dots" role="progressbar" aria-label="Fortschritt" aria-valuemin="0" aria-valuemax="12" aria-valuenow="0"></div>
        </div>

        <!-- Alpi – Hauptfigur, groß und prominent -->
        <div class="alpaka-main-container">
            <svg id="alpaka-brushing" viewBox="0 0 200 220" class="alpaka-svg alpaka-large" aria-label="Alpi motiviert dich beim Putzen" role="img">
                <!-- Wollschopf -->
                <ellipse cx="100" cy="28" rx="32" ry="18" fill="#FFF5E1"/>
                <circle cx="78"  cy="26" r="10" fill="#FFF5E1"/>
                <circle cx="122" cy="26" r="10" fill="#FFF5E1"/>
                <circle cx="100" cy="20" r="12" fill="#FFF5E1"/>
                <!-- Ohren -->
                <rect x="68"  y="22" width="14" height="28" rx="7" fill="#FFE4B5" transform="rotate(-18 68 22)"/>
                <rect x="118" y="22" width="14" height="28" rx="7" fill="#FFE4B5" transform="rotate(18 118 22)"/>
                <rect x="71"  y="24" width="7" height="18" rx="4" fill="#FFB6C1" transform="rotate(-18 71 24)"/>
                <rect x="122" y="24" width="7" height="18" rx="4" fill="#FFB6C1" transform="rotate(18 122 24)"/>
                <!-- Kopf -->
                <ellipse cx="100" cy="78" rx="46" ry="44" fill="#FFF5E1"/>
                <!-- Augen -->
                <ellipse id="eye-bl" cx="82" cy="68" rx="8" ry="9" fill="#fff" stroke="#333" stroke-width="1.5"/>
                <circle  id="pupil-bl" cx="84" cy="70" r="4.5" fill="#333"/>
                <circle  cx="86" cy="68" r="1.5" fill="#fff"/>
                <ellipse id="eye-br" cx="118" cy="68" rx="8" ry="9" fill="#fff" stroke="#333" stroke-width="1.5"/>
                <circle  id="pupil-br" cx="120" cy="70" r="4.5" fill="#333"/>
                <circle  cx="122" cy="68" r="1.5" fill="#fff"/>
                <!-- Nase -->
                <ellipse cx="100" cy="88" rx="14" ry="9" fill="#FFD4C2"/>
                <circle cx="96" cy="88" r="3" fill="#E88E6A" opacity="0.6"/>
                <circle cx="104" cy="88" r="3" fill="#E88E6A" opacity="0.6"/>
                <!-- Mund (Expression-gesteuert) -->
                <path id="mouth-brushing" d="M 90 98 Q 100 108 110 98" fill="none" stroke="#E88E6A" stroke-width="3" stroke-linecap="round"/>
                <!-- Wangen -->
                <ellipse cx="72" cy="82" rx="10" ry="6" fill="#FFB6C1" opacity="0.35"/>
                <ellipse cx="128" cy="82" rx="10" ry="6" fill="#FFB6C1" opacity="0.35"/>
                <!-- Körper -->
                <ellipse cx="100" cy="165" rx="58" ry="52" fill="#FFF5E1"/>
                <!-- Beine -->
                <rect x="68"  y="195" width="18" height="22" rx="9" fill="#FFE4B5"/>
                <rect x="114" y="195" width="18" height="22" rx="9" fill="#FFE4B5"/>
                <!-- Hufe -->
                <rect x="68"  y="212" width="18" height="8" rx="4" fill="#D4A86A"/>
                <rect x="114" y="212" width="18" height="8" rx="4" fill="#D4A86A"/>
                <!-- Zahnbürste in Hand (optional visuell) -->
                <rect id="toothbrush" x="148" y="130" width="8" height="36" rx="4" fill="#A3D8F4"/>
                <rect x="148" y="130" width="8" height="14" rx="4" fill="#fff" stroke="#A3D8F4" stroke-width="1"/>
                <line x1="150" y1="133" x2="155" y2="140" stroke="#A3D8F4" stroke-width="1.5"/>
                <line x1="154" y1="133" x2="150" y2="140" stroke="#A3D8F4" stroke-width="1.5"/>
            </svg>

            <!-- Sprechblase über Alpi -->
            <div id="speech-bubble" class="bubble" role="status" aria-live="polite">Schnapp dir deine Bürste!</div>
        </div>

        <!-- Anweisungsbox -->
        <div class="instruction-box">
            <h2 id="instruction-text" aria-live="assertive">Bist du bereit?</h2>
            <div id="timer-display" role="status" aria-live="off" aria-label="Zeit verbleibend">03:00</div>
        </div>

        <!-- Zahn-Guide -->
        <div class="visual-guide">
            <svg viewBox="0 0 120 70" class="teeth-svg" aria-label="Zahnschema: aktiver Bereich wird hervorgehoben" role="img">
                <!-- Zahn-Umrisse obere Reihe -->
                <rect x="22" y="12" width="14" height="18" rx="6" fill="#EEE" stroke="#DDD" stroke-width="1.5"/>
                <rect x="38" y="10" width="16" height="20" rx="6" fill="#EEE" stroke="#DDD" stroke-width="1.5"/>
                <rect x="56" y="10" width="16" height="20" rx="6" fill="#EEE" stroke="#DDD" stroke-width="1.5"/>
                <rect x="74" y="12" width="14" height="18" rx="6" fill="#EEE" stroke="#DDD" stroke-width="1.5"/>
                <!-- Zahn-Umrisse untere Reihe -->
                <rect x="22" y="38" width="14" height="18" rx="6" fill="#EEE" stroke="#DDD" stroke-width="1.5"/>
                <rect x="38" y="40" width="16" height="18" rx="6" fill="#EEE" stroke="#DDD" stroke-width="1.5"/>
                <rect x="56" y="40" width="16" height="18" rx="6" fill="#EEE" stroke="#DDD" stroke-width="1.5"/>
                <rect x="74" y="38" width="14" height="18" rx="6" fill="#EEE" stroke="#DDD" stroke-width="1.5"/>
                <!-- Highlights (werden per JS gesteuert) -->
                <rect id="zone-oben"  x="20" y="8"  width="76" height="26" rx="8" fill="none" stroke="transparent" stroke-width="3"/>
                <rect id="zone-unten" x="20" y="36" width="76" height="24" rx="8" fill="none" stroke="transparent" stroke-width="3"/>
            </svg>
            <p id="zone-label" class="zone-label">Gleich geht's los!</p>
        </div>

    </section>

    <!-- ==================== FINISH-SCREEN ==================== -->
    <section id="screen-finish" class="screen" role="main">
        <!-- Konfetti-Container -->
        <div id="confetti-container" aria-hidden="true"></div>

        <!-- Fröhliches Alpi -->
        <svg id="alpaka-finish" viewBox="0 0 200 220" class="alpaka-svg alpaka-celebrate" aria-label="Alpi feiert mit dir!" role="img">
            <!-- Wollschopf -->
            <ellipse cx="100" cy="28" rx="32" ry="18" fill="#FFF5E1"/>
            <circle cx="78"  cy="26" r="10" fill="#FFF5E1"/>
            <circle cx="122" cy="26" r="10" fill="#FFF5E1"/>
            <circle cx="100" cy="20" r="12" fill="#FFF5E1"/>
            <!-- Ohren -->
            <rect x="68"  y="22" width="14" height="28" rx="7" fill="#FFE4B5" transform="rotate(-18 68 22)"/>
            <rect x="118" y="22" width="14" height="28" rx="7" fill="#FFE4B5" transform="rotate(18 118 22)"/>
            <rect x="71"  y="24" width="7" height="18" rx="4" fill="#FFB6C1" transform="rotate(-18 71 24)"/>
            <rect x="122" y="24" width="7" height="18" rx="4" fill="#FFB6C1" transform="rotate(18 122 24)"/>
            <!-- Kopf -->
            <ellipse cx="100" cy="78" rx="46" ry="44" fill="#FFF5E1"/>
            <!-- Froh-Augen (geschlossen, lachend) -->
            <path d="M 74 68 Q 82 60 90 68" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
            <path d="M 110 68 Q 118 60 126 68" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
            <!-- Nase -->
            <ellipse cx="100" cy="88" rx="14" ry="9" fill="#FFD4C2"/>
            <circle cx="96" cy="88" r="3" fill="#E88E6A" opacity="0.6"/>
            <circle cx="104" cy="88" r="3" fill="#E88E6A" opacity="0.6"/>
            <!-- Mund (breites Lächeln) -->
            <path d="M 84 98 Q 100 115 116 98" fill="none" stroke="#E88E6A" stroke-width="3.5" stroke-linecap="round"/>
            <!-- Wangen – stark gerötet vor Freude -->
            <ellipse cx="72" cy="82" rx="12" ry="7" fill="#FFB6C1" opacity="0.55"/>
            <ellipse cx="128" cy="82" rx="12" ry="7" fill="#FFB6C1" opacity="0.55"/>
            <!-- Sterne um den Kopf -->
            <text x="42" y="40" font-size="14" aria-hidden="true">⭐</text>
            <text x="145" y="40" font-size="14" aria-hidden="true">⭐</text>
            <text x="93" y="18" font-size="12" aria-hidden="true">✨</text>
            <!-- Körper -->
            <ellipse cx="100" cy="165" rx="58" ry="52" fill="#FFF5E1"/>
            <!-- Arme hochgestreckt (Jubel) -->
            <ellipse cx="50" cy="140" rx="10" ry="28" fill="#FFE4B5" transform="rotate(-40 50 140)"/>
            <ellipse cx="150" cy="140" rx="10" ry="28" fill="#FFE4B5" transform="rotate(40 150 140)"/>
            <!-- Beine -->
            <rect x="68"  y="195" width="18" height="22" rx="9" fill="#FFE4B5"/>
            <rect x="114" y="195" width="18" height="22" rx="9" fill="#FFE4B5"/>
            <rect x="68"  y="212" width="18" height="8" rx="4" fill="#D4A86A"/>
            <rect x="114" y="212" width="18" height="8" rx="4" fill="#D4A86A"/>
        </svg>

        <h1>Super gemacht, <span class="user-name"></span>! 🎉</h1>
        <p>Deine Zähne funkeln wie Sterne!</p>

        <!-- Sterne-Bewertung (immer 3 Sterne – du hast immer gewonnen!) -->
        <div class="star-rating" aria-label="3 von 3 Sternen" role="img">
            <span class="star">⭐</span>
            <span class="star">⭐</span>
            <span class="star">⭐</span>
        </div>

        <p class="finish-tip">Die Zahnteufel wurden besiegt! 👿💨</p>

        <button id="btn-restart" class="btn-main">🔄 Nochmal putzen!</button>
    </section>

</div>

<script src="script.js"></script>
</body>
</html>
